<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Registro - OpenHorti</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .tabs button {
            padding: 10px 20px;
            border: none;
            background-color: #ddd;
            cursor: pointer;
            border-radius: 5px;
        }
        .tabs button.active {
            background-color: #4CAF50;
            color: white;
        }
        form {
            display: none;
        }
        form.active {
            display: block;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button.submit {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }
        button.submit:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="active" onclick="showForm('login')">Login</button>
            <button onclick="showForm('registro')">Registro</button>
        </div>
        <form id="login" class="active" onsubmit="redirectToCardapio(event)">
            <h2>Login</h2>
            <input type="text" placeholder="Usuário" required>
            <input type="password" placeholder="Senha" required>
            <button class="submit">Entrar</button>
        </form>
        <form id="registro" onsubmit="redirectToCardapio(event)">
            <h2>Registro</h2>
            <input type="text" placeholder="Usuário" required>
            <input type="password" placeholder="Senha" required>
            <input type="password" placeholder="Confirmar Senha" required>
            <button class="submit">Registrar</button>
        </form>
    </div>
    <script>
        function showForm(form) {
            document.querySelectorAll('form').forEach(f => f.classList.remove('active'));
            document.getElementById(form).classList.add('active');
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            document.querySelector(`[onclick="showForm('${form}')"]`).classList.add('active');
        }

        function redirectToCardapio(event) {
            event.preventDefault();
            window.location.href = 'cardapio.html';
        }
    </script>
</body>
</html>
